<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Write &middot; Foram's OS Journal</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    try {
      const saved = localStorage.getItem('os-journal-theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>
</head>
<body class="page-editor">
  <header class="editor-header">
    <div class="editor-header-inner">
      <div class="editor-header-left">
        <a class="editor-back" href="/" aria-label="Back to journal" title="Back to journal">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M11 18l-6-6 6-6"></path>
          </svg>
        </a>
        <a class="brand brand-compact" href="/" aria-label="Foram's OS Journal home">
          <span class="brand-mark">F</span>
          <span class="brand-name">Foram<span class="dot">.</span></span>
        </a>
      </div>

      <div class="save-state" id="saveState" aria-live="polite">
        <span class="save-dot"></span>
        <span id="saveStateText">New draft</span>
      </div>

      <div class="editor-header-actions">
        <button type="button" class="btn btn-quiet btn-small hide-mobile" id="previewBtn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
            <circle cx="12" cy="12" r="2.6"></circle>
          </svg>
          Preview
        </button>

        <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle theme">
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.3A8.5 8.5 0 1 1 9.7 3.5a7 7 0 0 0 10.8 10.8Z"></path>
          </svg>
        </button>

        <div class="menu-wrap">
          <button type="button" class="icon-btn" id="moreBtn" aria-label="More options" aria-haspopup="menu" aria-expanded="false">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <circle cx="5" cy="12" r="1.6"></circle>
              <circle cx="12" cy="12" r="1.6"></circle>
              <circle cx="19" cy="12" r="1.6"></circle>
            </svg>
          </button>
          <div class="menu" id="moreMenu" role="menu" hidden>
            <button type="button" class="menu-item" id="menuSave" role="menuitem">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path><path d="M17 21v-8H7v8M7 3v5h8"></path></svg>
              Save now
            </button>
            <button type="button" class="menu-item" id="menuView" role="menuitem" hidden>
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
              View post
            </button>
            <button type="button" class="menu-item" id="menuUnpublish" role="menuitem" hidden>
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
              Move to drafts
            </button>
            <div class="menu-separator"></div>
            <button type="button" class="menu-item is-danger" id="menuDelete" role="menuitem">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"></path></svg>
              Delete post
            </button>
          </div>
        </div>

        <button type="button" class="btn btn-primary btn-small" id="publishBtn">Publish</button>
      </div>
    </div>
  </header>

  <main class="editor-main">
    <div class="editor-canvas">
      <div class="cover-zone">
        <button type="button" class="cover-add" id="coverBtn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <circle cx="9" cy="10" r="1.6"></circle>
            <path d="m21 15-4.5-4.5L7 20"></path>
          </svg>
          Add a cover image
        </button>

        <div class="cover-preview" id="coverPreview" hidden>
          <img id="coverImg" alt="Post cover">
          <div class="cover-tools">
            <button type="button" class="cover-tool" id="changeCoverBtn">Change</button>
            <button type="button" class="cover-tool" id="removeCoverBtn">Remove</button>
          </div>
        </div>
      </div>

      <textarea id="titleInput" class="title-input" rows="1" maxlength="180" placeholder="Title" aria-label="Post title" spellcheck="true"></textarea>
      <textarea id="subtitleInput" class="subtitle-input" rows="1" maxlength="320" placeholder="Add a subtitle..." aria-label="Post subtitle" spellcheck="true"></textarea>

      <div class="editor-meta-row">
        <label class="tag-field">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 13 13 20a2 2 0 0 1-2.8 0L3 12.8V4h8.8L20 12a1.4 1.4 0 0 1 0 1Z"></path>
            <circle cx="7.5" cy="8.5" r="1.2"></circle>
          </svg>
          <input type="text" id="tagsInput" placeholder="Add tags, separated by commas" aria-label="Tags" autocomplete="off">
        </label>
        <span class="editor-stats" id="editorStats">0 words &middot; 1 min read</span>
      </div>

      <div class="toolbar-wrap">
        <div class="toolbar" role="toolbar" aria-label="Text formatting">
          <div class="tool-group">
            <button type="button" class="tool" data-command="undo" title="Undo (Ctrl+Z)" aria-label="Undo">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>
            </button>
            <button type="button" class="tool" data-command="redo" title="Redo (Ctrl+Y)" aria-label="Redo">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"></path><path d="M20 9H10a6 6 0 0 0 0 12h3"></path></svg>
            </button>
          </div>

          <span class="tool-separator" aria-hidden="true"></span>

          <div class="tool-group">
            <button type="button" class="tool tool-text" data-command="bold" data-state="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
            <button type="button" class="tool tool-text" data-command="italic" data-state="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
            <button type="button" class="tool tool-text" data-command="underline" data-state="underline" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>
            <button type="button" class="tool tool-text" data-command="strikeThrough" data-state="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
          </div>

          <span class="tool-separator" aria-hidden="true"></span>

          <div class="tool-group">
            <button type="button" class="tool tool-label" data-command="formatBlock" data-value="h2" data-state="h2" title="Large heading" aria-label="Large heading">H2</button>
            <button type="button" class="tool tool-label" data-command="formatBlock" data-value="h3" data-state="h3" title="Small heading" aria-label="Small heading">H3</button>
            <button type="button" class="tool" data-command="formatBlock" data-value="blockquote" data-state="blockquote" title="Quote" aria-label="Quote">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7H5v6h4l-2 4M19 7h-4v6h4l-2 4"></path></svg>
            </button>
            <button type="button" class="tool" data-command="formatBlock" data-value="pre" data-state="pre" title="Code block" aria-label="Code block">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 9-4 3 4 3M16 9l4 3-4 3M14 5l-4 14"></path></svg>
            </button>
          </div>

          <span class="tool-separator" aria-hidden="true"></span>

          <div class="tool-group">
            <button type="button" class="tool" data-command="insertUnorderedList" data-state="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"></path><circle cx="4" cy="6" r="1"></circle><circle cx="4" cy="12" r="1"></circle><circle cx="4" cy="18" r="1"></circle></svg>
            </button>
            <button type="button" class="tool" data-command="insertOrderedList" data-state="insertOrderedList" title="Numbered list" aria-label="Numbered list">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11"></path><path d="M4 5h1v3M4 8h2M4 14h2l-2 2h2M4 20h2l-2 2"></path></svg>
            </button>
          </div>

          <span class="tool-separator" aria-hidden="true"></span>

          <div class="tool-group">
            <button type="button" class="tool" id="linkBtn" title="Add link (Ctrl+K)" aria-label="Add link">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.1 1.1"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.1-1.1"></path></svg>
            </button>
            <button type="button" class="tool" id="imageBtn" title="Add image" aria-label="Add image">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m21 15-4.5-4.5L7 20"></path></svg>
            </button>
            <button type="button" class="tool" id="dividerBtn" title="Divider" aria-label="Insert divider">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 12h16"></path></svg>
            </button>
            <button type="button" class="tool" data-command="removeFormat" title="Clear formatting" aria-label="Clear formatting">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5h16v2M9 20h6M12 5l-2 15"></path><path d="m16 14 5 5M21 14l-5 5"></path></svg>
            </button>
          </div>
        </div>
      </div>

      <div
        id="contentEditor"
        class="prose editor-prose"
        contenteditable="true"
        role="textbox"
        aria-multiline="true"
        aria-label="Post content"
        data-placeholder="Tell the story..."
        spellcheck="true"
      ></div>

      <div class="editor-hint">
        <span class="hint-key">Tip</span>
        Paste images straight into the page. Everything saves automatically.
      </div>
    </div>
  </main>

  <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" hidden>
  <input type="file" id="coverInput" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" hidden>

  <dialog class="app-dialog" id="linkDialog">
    <form method="dialog" id="linkForm">
      <div class="dialog-head">
        <h3>Add a link</h3>
        <button type="button" class="icon-btn" id="linkCancel" aria-label="Close dialog">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </div>
      <label class="field">
        <span>Text</span>
        <input type="text" id="linkText" placeholder="Link text">
      </label>
      <label class="field">
        <span>URL</span>
        <input type="url" id="linkUrl" placeholder="https://example.com" required>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-quiet" id="linkCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="linkSubmit">Add link</button>
      </div>
    </form>
  </dialog>

  <script src="/js/common.js"></script>
  <script src="/js/editor.js"></script>
</body>
</html>
